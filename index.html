<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECO-TING | Aplikasi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<style>
:root{--f:#0f3d26;--g:#1f9d4d;--l:#b8f26b;--s:#ffd84d;--m:#eef7e6;--ink:#12261b;--mu:#5b7466;--ln:#dbe9d2;--r:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#cfe3c4;display:flex;justify-content:center}
button,input,select{font:inherit}
.phone{width:100%;max-width:430px;height:100dvh;max-height:900px;margin:auto;background:#f6faf2;position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){.phone{border-radius:34px;box-shadow:0 30px 70px rgba(15,61,38,.35);height:min(860px,96dvh)}}
#app{flex:1;overflow-y:auto;padding-bottom:20px}
button{cursor:pointer}:focus-visible{outline:3px solid var(--s);outline-offset:2px}
.top{background:linear-gradient(160deg,var(--f),var(--g));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 70px;border-radius:0 0 28px 28px}
.hi{display:flex;justify-content:space-between;align-items:center}
.hi small{opacity:.8;display:block}.hi b{font-size:1.2rem}
.pill{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:7px 14px;font-weight:600}
.wallet{background:#fff;margin:-48px 16px 0;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,61,38,.15);display:flex;justify-content:space-between;align-items:center;gap:10px}
.wallet small{color:var(--mu)}.wallet b{font-size:1.45rem;display:block}
.mini{border:0;background:var(--m);color:var(--f);font-weight:700;padding:9px 14px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:20px 14px 6px}
.tile{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--ink);text-align:center}
.tile i{font-style:normal;width:56px;height:56px;border-radius:18px;background:var(--m);display:grid;place-items:center;font-size:1.7rem;transition:transform .15s}
.tile:active i{transform:scale(.92)}
.h{padding:6px 18px;display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.h b{font-size:1.1rem}.h a{color:var(--g);font-weight:600;font-size:.85rem;cursor:pointer}
.promo{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 10px;scroll-snap-type:x mandatory}
.promo div{flex:0 0 78%;scroll-snap-align:start;border-radius:18px;padding:16px;color:#fff;min-height:104px}
.promo b{display:block;font-size:1.05rem;margin-bottom:4px}
.card{background:#fff;border-radius:16px;margin:10px 16px;padding:14px;box-shadow:0 2px 10px rgba(15,61,38,.07);border:2px solid transparent;width:calc(100% - 32px);text-align:left;display:block}
.card.sel{border-color:var(--g);background:#f1fbe9}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:.85rem}
.tag{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--m);color:var(--f)}
.tag.Diajukan{background:#fff3c4;color:#6b5400}.tag.Diterima{background:#d7ecff;color:#0b4a82}.tag.Selesai{background:#d4f5d9;color:#14692e}.tag.Ditolak{background:#ffdcdc;color:#9b1c1c}
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.bar button{border:0;background:var(--m);width:36px;height:36px;border-radius:50%;font-size:1.1rem}
.bar b{font-size:1.1rem}
.pad{padding:16px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:.9rem}
input,select{width:100%;padding:13px 14px;border:2px solid var(--ln);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--g);outline:0}
.cta{width:100%;border:0;border-radius:16px;padding:15px;background:var(--g);color:#fff;font-weight:700;font-size:1rem;margin-top:18px}
.cta.o{background:#fff;color:var(--f);border:2px solid var(--ln)}.cta.d{background:var(--r)}
.cta:disabled{opacity:.5}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:14px;border:2px solid var(--ln);background:#fff;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--l);border-color:var(--g);color:var(--f)}
.err{color:var(--r);font-size:.85rem;margin-top:8px;min-height:1.2em}
nav{display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.72rem;font-weight:600;color:var(--mu);gap:1px}
nav button span{font-size:1.35rem;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--g)}nav button.on span{filter:none;opacity:1}
#toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--f);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-weight:600;font-size:.9rem;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* login */
.lg{min-height:100%;background:linear-gradient(180deg,#fff 0,#eaf7de 55%,#b9efa6 100%);padding:calc(env(safe-area-inset-top,0px) + 30px) 24px 30px;text-align:center}
.lg img{width:150px;height:auto;border-radius:24px;box-shadow:0 10px 30px rgba(31,157,77,.25);animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:0}}
.lg h1{font-size:2rem;color:var(--f);margin:12px 0 0;letter-spacing:-.03em}
.lg p{color:var(--mu);margin:2px 0 20px}
.box{background:#fff;border-radius:24px;padding:8px 18px 20px;text-align:left;box-shadow:0 10px 30px rgba(15,61,38,.12)}
.sw{display:flex;background:var(--m);border-radius:14px;padding:4px;margin:12px 0 0}
.sw button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--mu)}
.sw button.on{background:#fff;color:var(--f);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tl{margin:6px 0 0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 16px 30px;color:var(--mu)}
.tl li::before{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ln)}
.tl li::after{content:"";position:absolute;left:7px;top:20px;bottom:-3px;width:2px;background:var(--ln)}
.tl li:last-child::after{display:none}
.tl li.ok{color:var(--ink);font-weight:600}.tl li.ok::before{background:var(--g)}
.struk{background:#fffef6;font-family:"Courier New",monospace;padding:18px;margin-top:14px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.struk div{display:flex;justify-content:space-between;padding:2px 0}.struk hr{border:0;border-top:2px dashed #aaa}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.stat div{background:#fff;border-radius:16px;padding:14px}.stat b{font-size:1.2rem;display:block}
</style>
</head>

function auth(){const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,e=$("#err");
if(!/^\S+@\S+\.\S+$/.test(em))return e.textContent="Format email belum benar.";
if(pw.length<6)return e.textContent="Kata sandi minimal 6 karakter.";
if(S.mode==="daftar"){const nm=$("#nm").value.trim();if(!nm)return e.textContent="Nama wajib diisi.";
if(S.users.some(u=>u.email===em))return e.textContent="Email sudah terdaftar. Silakan masuk.";
const u={nama:nm,email:em,pw,rek:$("#rk").value.trim()||"-"};S.users.push(u);S.user=u}
else{const u=S.users.find(u=>u.email===em&&u.pw===pw);if(!u)return e.textContent="Email atau kata sandi salah.";S.user=u}
toast("Selamat datang, "+S.user.nama.split(" ")[0]);go("home")}
/* HOME */
function vHome(){const P=S.role==="Pengumpul",wait=S.tx.filter(t=>t.status==="Diajukan").length;
const tiles=P?[["♻️","Setor Sampah","setor"],["🏪","Cari Pengepul","setor"],["💲","Harga","harga"],["🧾","Riwayat","tx"],["🚚","Jemput","info1"],["📊","Laporan","laporan"],["🎁","Poin Eco","info2"],["❓","Bantuan","info3"]]
:[["📥","Permintaan","tx"],["💲","Harga","harga"],["📒","Buku Besar","laporan"],["📊","Statistik","laporan"],["✅","Verifikasi","tx"],["💳","Pembayaran","tx"],["⬇️","Unduh","csv"],["❓","Bantuan","info3"]];
return `<div class="top"><div class="hi"><div><small>Halo,</small><b>${S.user.nama}</b></div><button class="pill" onclick="swapRole()">Mode ${S.role} ⇄</button></div></div>
<div class="wallet"><div><small>Saldo Eco-Pay</small><b>${rp(S.saldo[S.role])}</b></div><button class="mini" onclick="S.saldo[S.role]+=50000;toast('Saldo bertambah Rp50.000 (demo)');draw()">+ Isi saldo</button></div>
<div class="grid">${tiles.map(t=>`<button class="tile" onclick="tile('${t[2]}')"><i>${t[0]}</i>${t[1]}</button>`).join("")}</div>
<div class="promo"><div style="background:linear-gradient(135deg,#1f9d4d,#0f3d26)"><b>Pilah dari rumah</b>Pisahkan plastik, kertas, dan kaleng agar harga jualnya lebih tinggi.</div><div style="background:linear-gradient(135deg,#e0a800,#b36b00)"><b>Jemput gratis ongkir?</b>Kumpulkan minimal 20 kg lalu ajukan jemput ke pengepul terdekat.</div><div style="background:linear-gradient(135deg,#2b7fd0,#124a85)"><b>Minyak jelantah laku</b>Simpan di botol tertutup dan setor tiap bulan.</div></div>
<div class="h"><b>${P?"Transaksi terbaru":"Permintaan masuk"}</b><a onclick="go('tx')">Lihat semua</a></div>
${(P?mine():S.tx.filter(t=>t.status!=="Selesai")).slice(0,3).map(card).join("")||`<p class="mu pad">${P?"Belum ada transaksi. Mulai dengan Setor Sampah.":"Tidak ada permintaan."}</p>`}`}
function tile(k){if(k==="csv")return csv();if(k==="info1")return toast("Pilih metode Dijemput saat mengajukan transaksi");if(k==="info2")return toast("Poin Eco segera hadir");if(k==="info3")return toast("Bantuan: halo@ecoting.id");go(k)}
function swapRole(){S.role=S.role==="Pengumpul"?"Pengepul":"Pengumpul";toast("Beralih ke mode "+S.role);draw()}
function card(t){return `<button class="card" onclick="go('detail','${t.id}')"><div class="row"><b>${IKON[t.jenis]} ${t.jenis} · ${t.kg} kg</b><span class="tag ${t.status}">${t.status}</span></div><div class="row mu"><span>${S.role==="Pengumpul"?t.pengepul:t.pengumpul}</span><span>${rp(sub(t))}</span></div></button>`}
/* SETOR */
function vSetor(){const d=S.draft;return head("Setor sampah")+`<div class="pad"><label for="jn">Jenis sampah</label><select id="jn">${Object.keys(HARGA).map(k=>`<option ${d.jenis===k?"selected":""}>${k}</option>`).join("")}</select>
<label for="kg">Berat (kg)</label><input id="kg" type="number" min="0.5" step="0.5" value="${d.kg||5}">
<label for="sp">Spesifikasi</label><input id="sp" placeholder="Contoh: bersih, tanpa label" value="${d.sp||""}">
<div class="card" style="margin:16px 0 0;width:100%;background:var(--m)"><div class="row"><span class="mu">Perkiraan nilai</span><b id="est"></b></div></div>
<div class="err" id="err" role="alert"></div><button class="cta" onclick="toPilih()">Pilih pengepul</button></div>`}
function est(){const e=$("#est");if(e)e.textContent=rp(HARGA[$("#jn").value]*(parseFloat($("#kg").value)||0))}
function toPilih(){const kg=parseFloat($("#kg").value);if(!(kg>0))return $("#err").textContent="Berat harus lebih dari 0.";
S.draft={jenis:$("#jn").value,kg,sp:$("#sp").value,p:S.draft.p||0,jemput:S.draft.jemput!==false};go("pilih")}
function vPilih(){const d=S.draft,p=PENGEPUL[d.p],o=d.jemput?p.o:0;
return head("Pilih pengepul","setor")+PENGEPUL.map((x,i)=>`<button class="card ${i===d.p?"sel":""}" onclick="S.draft.p=${i};draw()"><div class="row"><b>🏪 ${x.n}</b><span>⭐ ${x.r}</span></div><div class="mu">${x.km} km dari lokasi Anda · ongkir jemput ${rp(x.o)}</div></button>`).join("")+
`<div class="pad"><label>Metode pengambilan</label><div class="seg"><button class="${d.jemput?"on":""}" onclick="S.draft.jemput=true;draw()">Dijemput</button><button class="${d.jemput?"":"on"}" onclick="S.draft.jemput=false;draw()">Antar sendiri</button></div>
<div class="card" style="margin:16px 0 0;width:100%"><div class="row"><span class="mu">${d.jenis} ${d.kg} kg</span><span>${rp(HARGA[d.jenis]*d.kg)}</span></div><div class="row"><span class="mu">Ongkir (dibayar pengumpul)</span><span>${rp(o)}</span></div><hr style="border:0;border-top:1px solid var(--ln)"><div class="row"><b>Total harga</b><b>${rp(HARGA[d.jenis]*d.kg+o)}</b></div></div>
<button class="cta" onclick="ajukan()">Ajukan transaksi</button></div>`}
function ajukan(){const d=S.draft,p=PENGEPUL[d.p],id="T-"+(1000+S.tx.length+1);
S.tx.unshift({id,jenis:d.jenis,kg:d.kg,pengumpul:S.user.nama,pengepul:p.n,jemput:d.jemput,ongkir:d.jemput?p.o:0,status:"Diajukan",tgl:"27 Nov 2026"});S.draft={};toast("Transaksi diajukan");go("detail",id)}
/* LIST & DETAIL */
function vTx(){const l=mine();return head("Transaksi")+(l.map(card).join("")||`<p class="mu pad">Belum ada transaksi.</p>`)}
function vDetail(){const t=S.tx.find(x=>x.id===param),P=S.role==="Pengumpul",st=t.status,
step=(a,txt)=>`<li class="${a?"ok":""}">${txt}</li>`,tot=sub(t)+t.ongkir;
let act="";
if(!P&&st==="Diajukan")act=`<button class="cta" onclick="setSt('${t.id}','Diterima','Sampah diverifikasi')">Terima & verifikasi sampah</button><button class="cta d" onclick="setSt('${t.id}','Ditolak','Transaksi ditolak')">Tolak</button>`;
if(!P&&st==="Diterima")act=`<button class="cta" onclick="bayar('${t.id}')">Bayar ${rp(sub(t))} ke pengumpul</button>`;
if(P&&st==="Ditolak")act=`<button class="cta" onclick="setSt('${t.id}','Diajukan','Diajukan ulang')">Ajukan ulang</button>`;
if(P&&(st==="Diajukan"||st==="Diterima"))act=`<p class="mu" style="margin-top:14px">Menunggu pengepul. Untuk simulasi, beralih ke mode Pengepul.</p><button class="cta o" onclick="swapRole();go('detail','${t.id}')">Beralih ke mode Pengepul</button>`;
return head("Detail "+t.id,"tx")+`<div class="pad"><div class="row"><b style="font-size:1.2rem">${IKON[t.jenis]} ${t.jenis}</b><span class="tag ${st}">${st}</span></div>
<p class="mu">${t.kg} kg · ${t.jemput?"Dijemput":"Diantar sendiri"}<br>${P?"Pengepul":"Pengumpul"}: ${P?t.pengepul:t.pengumpul}</p>
<ul class="tl">${step(1,"Pengumpul mengajukan transaksi")}${step(st!=="Diajukan"&&st!=="Ditolak","Sampah diverifikasi pengepul")}${st==="Ditolak"?step(1,"Ditolak oleh pengepul"):step(st==="Selesai","Pembayaran dan struk digital")}</ul>
${act}
${st==="Selesai"?`<div class="struk"><div><b>ECO-TING</b><span>${t.tgl}</span></div><div><span>No.</span><span>${t.id}</span></div><hr><div><span>${t.jenis} ${t.kg} kg</span><span>${rp(sub(t))}</span></div><div><span>Ongkir</span><span>${rp(t.ongkir)}</span></div><hr><div><b>Total</b><b>${rp(tot)}</b></div><div><span>Saldo diterima</span><span>${rp(sub(t))}</span></div></div>`:""}</div>`}
function setSt(id,s,m){S.tx.find(x=>x.id===id).status=s;toast(m);draw()}
function bayar(id){const t=S.tx.find(x=>x.id===id);if(S.saldo.Pengepul<sub(t))return toast("Saldo pengepul kurang. Isi saldo dulu");
S.saldo.Pengepul-=sub(t);S.saldo.Pengumpul+=sub(t);t.status="Selesai";toast("Pembayaran berhasil");draw()}
/* HARGA, LAPORAN, AKUN */
function vHarga(){return head("Daftar harga")+Object.keys(HARGA).map(k=>`<div class="card"><div class="row"><b>${IKON[k]} ${k}</b><b>${rp(HARGA[k])}/kg</b></div></div>`).join("")+`<p class="mu pad">Harga contoh. Pengepul dapat memperbarui harga di versi lengkap.</p>`}
function vLaporan(){const d=S.tx.filter(t=>t.status==="Selesai"&&(S.role==="Pengepul"||t.pengumpul===S.user.nama)),tot=d.reduce((a,t)=>a+sub(t),0),kg=d.reduce((a,t)=>a+t.kg,0);
return head(S.role==="Pengepul"?"Buku besar":"Laporan")+`<div class="stat" style="margin-top:14px"><div><span class="mu">${S.role==="Pengepul"?"Pembelian":"Pendapatan"}</span><b>${rp(tot)}</b></div><div><span class="mu">Total berat</span><b>${kg} kg</b></div></div>
<div class="h"><b>Aktivitas selesai</b></div>${d.map(card).join("")||`<p class="mu pad">Belum ada transaksi selesai.</p>`}<div class="pad"><button class="cta" onclick="csv()">Unduh laporan (CSV)</button></div>`}
function csv(){const d=S.tx.filter(t=>t.status==="Selesai"),r=[["id","tanggal","jenis","kg","pengumpul","pengepul","subtotal","ongkir","total"],...d.map(t=>[t.id,t.tgl,t.jenis,t.kg,t.pengumpul,t.pengepul,sub(t),t.ongkir,sub(t)+t.ongkir])];
if(!d.length)return toast("Belum ada transaksi selesai");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.map(x=>x.join(",")).join("\n")],{type:"text/csv"}));a.download="laporan-ecoting.csv";a.click();toast("Laporan diunduh")}
function vAkun(){const u=S.user;return `<div class="top" style="padding-bottom:30px;text-align:center"><img src="${LOGO}" alt="" style="width:76px;border-radius:20px;background:#fff"><h2 style="margin:8px 0 0">${u.nama}</h2><div style="opacity:.8">${u.email}</div></div>
<div class="card"><div class="row"><span class="mu">Rekening</span><b>${u.rek}</b></div></div>
<div class="card"><div class="row"><span class="mu">Mode saat ini</span><b>${S.role}</b></div></div>
<div class="pad"><button class="cta o" onclick="swapRole()">Ganti ke mode ${S.role==="Pengumpul"?"Pengepul":"Pengumpul"}</button><button class="cta d" onclick="S.user=null;nav(0);go('login')">Keluar</button></div>`}
function nav(show){const n=$("#nav");n.hidden=!show}
function draw(){const V={login:vLogin,home:vHome,setor:vSetor,pilih:vPilih,tx:vTx,detail:vDetail,harga:vHarga,laporan:vLaporan,akun:vAkun};
if(!S.user&&route!=="login")route="login";
$("#app").innerHTML=V[route]();nav(route!=="login");
const items=[["home","🏠","Beranda"],["tx","🧾","Transaksi"],["harga","💲","Harga"],["akun","👤","Akun"]];
$("#nav").innerHTML=items.map(i=>`<button class="${route===i[0]?"on":""}" onclick="go('${i[0]}')"><span>${i[1]}</span>${i[2]}</button>`).join("");
if(route==="setor"){$("#jn").onchange=$("#kg").oninput=est;est()}}
draw();
</script>
</body>
</html>
